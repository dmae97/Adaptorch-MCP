[project]
name = "adaptorch-mcp-monorepo"
version = "0.1.0"
description = "Public monorepo for the AdaptOrch MCP bridge"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ClassicMate" }]

[tool.uv.workspace]
members = ["packages/adaptorch-mcp", "packages/adaptorch-client", "packages/adaptorch-cli"]

[tool.uv.sources]
adaptorch = { git = "https://github.com/dmae97/adaptorch.git", rev = "4ab0172443b1979662268a4d1f0690f913ee40dd" }
adaptorch-client = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-client/tests",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-cli/tests",
  "packages/adaptorch-mcp/src",
  "packages/adaptorch-mcp/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-mcp/src",
]
files = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-mcp/src",
]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-mcp/src",
  "../src",
]

[tool.pytest.ini_options]
pythonpath = ["packages/adaptorch-client/src", "packages/adaptorch-cli/src"]
testpaths = [
  "packages/adaptorch/tests",
  "packages/adaptorch-client/tests",
  "packages/adaptorch-cli/tests",
  "packages/adaptorch-mcp/tests",
]
addopts = "-q"
