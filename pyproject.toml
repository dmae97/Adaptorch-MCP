[project]
name = "adaptorch-mcp-monorepo"
version = "0.1.0"
description = "Public monorepo for the AdaptOrch MCP bridge"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ClassicMate" }]
# Lets a bare `uv sync` (the registry default build step) install the MCP server.
dependencies = ["adaptorch-client", "adaptorch-mcp"]

# The private engine is a maintainer-only dependency of this unpublished workspace
# root, never of a published package: `uv sync --all-packages --extra dev --group engine`
# installs the served pin below for the legacy bridge and parity tests.
[dependency-groups]
engine = ["adaptorch[api]>=0.1.2,<0.2"]

[tool.uv.workspace]
members = [
  "packages/adaptorch-mcp",
  "packages/adaptorch-client",
  "packages/adaptorch-cli",
]

[tool.uv.sources]
adaptorch = { git = "https://github.com/dmae97/adaptorch.git", rev = "a490658ceb6a3e1f7bfdc53d24249148860ef323" }
adaptorch-client = { workspace = true }
adaptorch-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-client/tests",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-cli/tests",
  "packages/adaptorch-mcp/src",
  "packages/adaptorch-mcp/legacy",
  "packages/adaptorch-mcp/tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-mcp/src",
]
files = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-mcp/src",
]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-mcp/src",
  "packages/adaptorch-mcp/legacy",
  "../src",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/adaptorch-client/src",
  "packages/adaptorch-cli/src",
  "packages/adaptorch-mcp/legacy",
]
testpaths = [
  "packages/adaptorch/tests",
  "packages/adaptorch-client/tests",
  "packages/adaptorch-cli/tests",
  "packages/adaptorch-mcp/tests",
]
addopts = "-q"
