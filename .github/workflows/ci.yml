name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workspace
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          uv sync --all-packages --extra dev
      - name: Lint
        run: uv run ruff check packages/adaptorch-mcp packages/adaptorch-client packages/adaptorch-cli
      - name: Typecheck
        run: uv run mypy
      - name: Test
        # Public install only; engine-dependent tests run via `make engine-check`.
        run: uv run make test
      - name: Credential-free stdio introspection
        # What a registry checks: start without a token and list the pinned tools.
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | env -u ADAPTORCH_CONTROL_PLANE_TOKEN uv run adaptorch-mcp --transport stdio > introspection.jsonl
          uv run python -c 'import json; r=[json.loads(l) for l in open("introspection.jsonl")]; assert r[0]["result"]["serverInfo"]["name"]=="adaptorch-mcp"; assert len(r[1]["result"]["tools"])==9, r'
      - name: Build package
        # The in-process adaptorch-mcp wrapper still depends on the private
        # engine, so it is build-checked but not a publishable wheel.
        run: uv run python -m build packages/adaptorch-mcp
      - name: Public wheel gate
        # No public wheel may carry engine code or depend on the private core.
        # adaptorch-mcp is intentionally excluded: it still wraps the engine
        # in-process, so a core dependency is expected and the gate would fail
        # it. It is gated again at publish time (publish.yml) if a release tag
        # ever tries to ship it.
        run: uv run python scripts/check_public_wheels.py --package adaptorch adaptorch-client adaptorch-cli
