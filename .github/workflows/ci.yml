name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public workspace
        run: uv sync --locked --all-packages --extra dev
      - name: Lint
        run: uv run ruff check packages/adaptorch-mcp packages/adaptorch-client packages/adaptorch-cli
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest packages/adaptorch-mcp/tests packages/adaptorch-client/tests packages/adaptorch-cli/tests packages/adaptorch/tests -q
      - name: Doctor
        run: uv run adaptorch-mcp-doctor --json
      - name: Public wheel gate
        # Every public distribution must be independently free of private core code/dependencies.
        run: uv run python scripts/check_public_wheels.py --package adaptorch adaptorch-client adaptorch-cli adaptorch-mcp
      - name: Clean public MCP wheel runtime
        run: |
          uv run python -m build --wheel packages/adaptorch-mcp --outdir /tmp/mcp-public-wheel
          python -m venv /tmp/mcp-public-runtime
          /tmp/mcp-public-runtime/bin/python -m pip install --isolated --index-url https://pypi.org/simple /tmp/mcp-public-wheel/*.whl
          cd /tmp
          PYTHONNOUSERSITE=1 /tmp/mcp-public-runtime/bin/python "$GITHUB_WORKSPACE/scripts/check_mcp_clean_install.py"
