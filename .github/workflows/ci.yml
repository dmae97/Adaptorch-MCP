name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install workspace
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          uv sync --all-packages --extra dev
      - name: Lint
        run: uv run ruff check packages/adaptorch-mcp packages/adaptorch-client packages/adaptorch-cli
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest packages/adaptorch-mcp/tests packages/adaptorch-client/tests packages/adaptorch-cli/tests packages/adaptorch/tests -q
      - name: Doctor
        run: uv run adaptorch-mcp-doctor --json
      - name: Build package
        run: uv run python -m build packages/adaptorch-mcp
      - name: Public wheel gate
        # No public wheel may carry engine code or depend on the private core.
        run: uv run python scripts/check_public_wheels.py --package adaptorch adaptorch-client adaptorch-cli adaptorch-mcp
