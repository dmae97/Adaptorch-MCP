  <text x="44" y="84" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="24" font-weight="700" fill="#EDE6D6">Outperforms single-call OFF &amp; 3x majority vote — with fewer tokens than voting</text>

  <!-- CTA pill -->
  <a href="https://adaptorch.com/#onoff-bench">
