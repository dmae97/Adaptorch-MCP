<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="AdaptOrch ON vs OFF and VOTE x3 benchmark summary from adaptorch.com: 69.5 percent pooled math accuracy (+14.0pt vs OFF, +12.3pt vs VOTE x3), 3227 tokens per question (-5.2 percent vs VOTE x3), per-problem wins 35 vs 4 and 33 vs 8, and 9/9 Three.js zero-error renders vs 7/9 OFF">
  <defs>
