      <stop offset="0" stop-color="#141425"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2a45" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="580" fill="url(#bg)"/>
  <rect width="1200" height="580" fill="url(#grid)" opacity="0.5"/>
  <rect x="6" y="6" width="1188" height="568" fill="none" stroke="#00d26a" stroke-opacity="0.35" stroke-width="2" rx="14"/>

