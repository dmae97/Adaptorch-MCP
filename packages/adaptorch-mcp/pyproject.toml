[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptorch-mcp"
version = "0.6.3"
description = "Remote-only Model Context Protocol (MCP) server for AdaptOrch — DAG task routing, multi-model synthesis, and verifiable execution receipts"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "ClassicMate" }]
keywords = [
  "mcp",
  "model-context-protocol",
  "adaptorch",
  "agent-orchestration",
  "multi-agent",
  "dag-routing",
  "llm-synthesis",
  "claude-code",
  "cursor",
  "codex",
  "ai-code-review",
  "ai-verification",
  "evidence-receipts",
  "byok",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["adaptorch-client>=0.1.7,<0.2"]

[project.optional-dependencies]
http = ["fastapi>=0.112", "uvicorn[standard]>=0.30"]
dev = [
  "build>=1.2", "mypy>=1.10", "pytest>=8.2", "ruff>=0.6", "fpdf2==2.8.9",
  "fastapi>=0.112", "uvicorn[standard]>=0.30", "httpx>=0.27",
]

[project.urls]
Homepage = "https://adaptorch.com"
Repository = "https://github.com/dmae97/Adaptorch-MCP"
Documentation = "https://adaptorch.com/mcp-docs"
Changelog = "https://github.com/dmae97/Adaptorch-MCP/blob/main/CHANGELOG.md"
Paper = "https://arxiv.org/abs/2602.16873"
Issues = "https://github.com/dmae97/Adaptorch-MCP/issues"

[project.scripts]
adaptorch-mcp = "adaptorch_mcp.cli:main"
adaptorch-mcp-client = "adaptorch_mcp.cli:main"
adaptorch-mcp-doctor = "adaptorch_mcp.doctor:main"
adaptorch-mcp-smoke = "adaptorch_mcp.stdio_smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptorch_mcp = ["py.typed", "remote_tool_catalog.json", "audit_tool_contracts.json", "route_tool_contract.json"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["src", "legacy", "../../../src", "../adaptorch-client/src"]
